<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - TuTienda México 🇲🇽</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #006341, #ce1126);
      padding: 20px;
    }
    .caja {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 5px;
      background: linear-gradient(90deg, #006341, #ce1126);
      -webkit-background-clip: text;
      color: transparent;
    }
    .saludo { font-size: 22px; margin-bottom: 5px; }
    .subtitulo { color: #666; margin-bottom: 25px; }
    .mensaje {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-weight: 600;
    }
    .exito { background: #e8f5e9; color: #2e7d32; display: block !important; }
    .error { background: #ffebee; color: #c62828; display: block !important; }
    .campo { text-align: left; margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      transition: border 0.2s;
    }
    input:focus { outline: none; border-color: #006341; }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #006341, #ce1126);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.02); }
    .enlace { margin-top: 20px; font-size: 14px; color: #666; }
    .enlace a { color: #006341; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>🇲🇽 TuTienda México</h1>
    <p class="saludo">¡Hola de nuevo! 👋</p>
    <p class="subtitulo">Inicia sesión y sigue comprando</p>

    <div id="mensaje" class="mensaje"></div>

    <form onsubmit="ingresar(event)">
      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="tu@correo.com" required>
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="contrasena" placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="btn">Entrar a mi cuenta ✅</button>
    </form>

    <p class="enlace">¿No tienes cuenta? <a href="registro.html">Créala aquí</a></p>
  </div>

<script>
function ingresar(e) {
  e.preventDefault();
  const correo = document.getElementById('correo').value.trim();
  const contrasena = document.getElementById('contrasena').value;
  const msg = document.getElementById('mensaje');
  msg.className = 'mensaje';

  // Obtener lista de usuarios
  const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
  
  // Buscar coincidencia
  const usuario = usuarios.find(u => u.correo === correo && u.contrasena === contrasena);

  if (usuario) {
    // Guardar sesión activa
    localStorage.setItem('usuarioActivo', JSON.stringify({ nombre: usuario.nombre, correo: usuario.correo }));
    msg.textContent = '✅ ¡Bienvenido de nuevo!';
    msg.classList.add('exito');
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1200);
  } else {
    msg.textContent = '❌ Correo o contraseña incorrectos';
    msg.classList.add('error');
  }
}
</script>
</body>
</html>
