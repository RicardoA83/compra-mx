<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - ComproMío MX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f5f5f5; padding: 2rem; }
    header { background: #1e3a8a; color: white; padding: 1.5rem; text-align: center; border-radius: 8px; margin-bottom: 2rem; }
    .contenedor { max-width: 1200px; margin: 0 auto; }
    .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .tab { padding: 0.8rem 1.5rem; background: #ddd; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab.activa { background: #1e3a8a; color: white; }
    .seccion { display: none; }
    .seccion.visible { display: block; }
    h2 { margin-bottom: 1.5rem; color: #1e3a8a; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f0f4f8; font-weight: bold; color: #1e3a8a; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-eliminar { background: #dc3545; color: white; }
    .volver { display: inline-block; margin-bottom: 1.5rem; color: #1e3a8a; text-decoration: none; font-weight: bold; }
    @media (max-width: 768px) {
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>

<div class="contenedor">
  <a href="/" class="volver">← Volver a la Tienda</a>
  
  <header>
    <h1>📊 Panel de Administración</h1>
    <p>ComproMío MX — Gestión de pedidos y usuarios</p>
  </header>

  <div class="tabs">
    <button class="tab activa" onclick="mostrarTab('pedidos')">📦 Pedidos</button>
    <button class="tab" onclick="mostrarTab('usuarios')">👥 Usuarios</button>
  </div>

  <div id="pedidos" class="seccion visible">
    <h2>Lista de Pedidos</h2>
    <table id="tabla-pedidos">
      <thead>
        <tr>
          <th>Número</th>
          <th>Cliente</th>
          <th>Contacto</th>
          <th>Método de Pago</th>
          <th>Total</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="lista-pedidos"></tbody>
    </table>
  </div>

  <div id="usuarios" class="seccion">
    <h2>Lista de Usuarios</h2>
    <table id="tabla-usuarios">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Fecha de Registro</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="lista-usuarios"></tbody>
    </table>
  </div>
</div>

<script>
async function mostrarTab(id) {
  document.querySelectorAll('.seccion').forEach(s => s.classList.remove('visible'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('activa'));
  document.getElementById(id).classList.add('visible');
  event.target.classList.add('activa');
  
  if (id === 'pedidos') cargarPedidos();
  if (id === 'usuarios') cargarUsuarios();
}

async function cargarPedidos() {
  const res = await fetch('/api/admin/pedidos');
  const json = await res.json();
  const lista = document.getElementById('lista-pedidos');
  
  if (json.pedidos.length === 0) {
    lista.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem; color:#666;">No hay pedidos registrados</td></tr>';
    return;
  }
  
  lista.innerHTML = json.pedidos.map(p => `
    <tr>
      <td><strong>${p.numero}</strong></td>
      <td>${p.nombre}</td>
      <td>${p.correo}<br>${p.telefono || '—'}</td>
      <td>${p.metodoPago}${p.referencia ? `<br><small>Ref: ${p.referencia}</small>` : ''}</td>
      <td>$${parseFloat(p.total).toLocaleString()} MXN</td>
      <td><button class="btn btn-eliminar" onclick="eliminarPedido('${p.numero}')">Eliminar</button></td>
    </tr>
  `).join('');
}

async function cargarUsuarios() {
  const res = await fetch('/api/admin/usuarios');
  const json = await res.json();
  const lista = document.getElementById('lista-usuarios');
  
  if (json.usuarios.length === 0) {
    lista.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem; color:#666;">No hay usuarios registrados</td></tr>';
    return;
  }
  
  lista.innerHTML = json.usuarios.map(u => `
    <tr>
      <td>${u.id}</td>
      <td>${u.nombre}</td>
      <td>${u.correo}</td>
      <td>${u.telefono || '—'}</td>
      <td>${new Date(u.fecha).toLocaleString()}</td>
      <td><button class="btn btn-eliminar" onclick="eliminarUsuario(${u.id})">Eliminar</button></td>
    </tr>
  `).join('');
}

async function eliminarPedido(numero) {
  if (!confirm('¿Eliminar este pedido?')) return;
  await fetch(`/api/admin/pedidos/${numero}`, { method: 'DELETE' });
  cargarPedidos();
}

async function eliminarUsuario(id) {
  if (!confirm('¿Eliminar este usuario?')) return;
  await fetch(`/api/admin/usuarios/${id}`, { method: 'DELETE' });
  cargarUsuarios();
}

cargarPedidos();
</script>

</body>
</html>
